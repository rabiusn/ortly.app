<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortly</title>
<style>
:root{--ink:#172A3A;--paper:#F4F6F8;--signal:#FFC93C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--paper);font:17px/1.55 -apple-system,"SF Pro Text",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:520px;text-align:center}
.mark{width:72px;height:72px;margin:0 auto 20px;border:5px solid var(--signal);border-radius:50%;position:relative}
.mark::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--signal)}
h1{font-stretch:condensed;font-size:48px;margin:0 0 8px;color:var(--signal)}
p{color:#D3DCE3;margin:0 0 24px}
nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:12px 18px;border-radius:12px;background:#24384A;color:var(--paper);text-decoration:none;font-weight:600}
a:hover{background:#2E4152}
</style>
</head>
<body>
<div class="box">
<div class="mark" aria-hidden="true"></div>
<h1>Ortly</h1>
<p>Halte die Kamera auf ein Gebäude und erfahre, was du siehst.</p>
<nav><a href="support.html">Hilfe und Kontakt</a><a href="datenschutz.html">Datenschutz</a></nav>
</div>
</body>
</html>
